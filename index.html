<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Limited Viewer</title>
<style>
* { box-sizing: border-box; }
body { margin: 0; padding: 16px; font-family: system-ui, "Segoe UI", sans-serif; background: #16181d; color: #e8eaed; }
main { max-width: 640px; margin: 0 auto; }
h1 { font-size: 20px; margin: 4px 0 14px; }
.search { display: flex; gap: 8px; }
input { flex: 1; min-width: 0; padding: 12px; border-radius: 10px; border: 1px solid #2f333b; background: #1f2229; color: inherit; font-size: 16px; }
button { padding: 12px 18px; border: 0; border-radius: 10px; background: #2d7ff9; color: #fff; font-weight: 600; font-size: 15px; }
button:disabled { opacity: .5; }
input:focus-visible, button:focus-visible { outline: 2px solid #4da3ff; outline-offset: 2px; }
#status { margin-top: 16px; color: #9aa0a9; }
#status.denied { color: #ffb454; font-weight: 700; font-size: 20px; }
#status.error { color: #ff6b6b; }
#summary { margin-top: 14px; }
#summary b { color: #7ee787; }
#grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(110px, 1fr)); gap: 8px; margin-top: 12px; }
.item { background: #1f2229; border-radius: 10px; padding: 8px; text-align: center; font-size: 12px; }
.item img { width: 100%; aspect-ratio: 1; border-radius: 6px; background: #2a2e36; }
.n { margin-top: 6px; font-weight: 600; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.m { color: #9aa0a9; margin-top: 2px; }
a { color: inherit; text-decoration: none; }
</style>
</head>
<body>
<main>
  <h1>Limited Viewer</h1>
  <div class="search">
    <input id="name" type="text" placeholder="Roblox username" autocomplete="off" autocapitalize="off">
    <button id="go">Search</button>
  </div>
  <div id="status"></div>
  <div id="summary"></div>
  <div id="grid"></div>
</main>
<script>
const $ = (id) => document.getElementById(id);
const esc = (s) => String(s).replace(/[&<>"]/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
function setStatus(t, c = "") { $("status").textContent = t; $("status").className = c; }

async function search() {
  const username = $("name").value.trim();
  if (!username) return;
  $("go").disabled = true; $("grid").innerHTML = ""; $("summary").textContent = "";
  setStatus("Loading...");
  try {
    const r = await fetch("/api/limiteds?username=" + encodeURIComponent(username));
    const d = await r.json();
    if (d.status === "notfound") return setStatus("Player not found.", "error");
    if (d.status === "private") return setStatus("Needed permission", "denied");
    if (d.status !== "ok") return setStatus(d.message || "Something went wrong.", "error");
    if (!d.total) return setStatus(d.user.name + " has no Limited items.");
    setStatus("");
    $("summary").innerHTML = `<b>${esc(d.user.name)}</b>: ${d.total} Limited${d.total > 1 ? "s" : ""} (${d.groups.length} unique), total RAP <b>${d.totalRap.toLocaleString()} R$</b>`;
    $("grid").innerHTML = d.groups.map((g) => `
      <div class="item">
        <a href="https://www.roblox.com/catalog/${g.assetId}" target="_blank" rel="noopener">
          <img src="${esc(g.img)}" alt="">
          <div class="n">${esc(g.name)}${g.count > 1 ? " x" + g.count : ""}</div>
        </a>
        <div class="m">${g.rap.toLocaleString()} R$</div>
        ${g.serials.length ? `<div class="m">#${g.serials.slice(0, 3).join(", #")}${g.serials.length > 3 ? "…" : ""}</div>` : ""}
      </div>`).join("");
  } catch (e) {
    setStatus("Could not reach the server.", "error");
  } finally { $("go").disabled = false; }
}
$("go").addEventListener("click", search);
$("name").addEventListener("keydown", (e) => { if (e.key === "Enter") search(); });
</script>
</body>
</html>
